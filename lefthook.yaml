commit-msg:
  commands:
    lint-commit-msg:
      run: >-
        head -n1 {1} | grep -qE '^((build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: .+|(Merge|Revert|fixup!|squash!|amend!) )'
        || { echo 'Commit message must follow Conventional Commits: type(scope)?: subject'; exit 1; }
pre-commit:
  parallel: true
  jobs:
    - name: Check Lockfile
      glob: '*.{ts,js,mjs,cjs,yml,yaml,md,mdx,json}'
      run: bun install --frozen-lockfile --silent
    - name: Check
      glob: '*.{ts,js,mjs,cjs}'
      run: bunx oxlint --fix --fix-suggestions {staged_files}
      stage_fixed: true
    - name: Format
      run: bun fmt --no-script --ignore-unknown {staged_files}
      stage_fixed: true
    - name: Knip
      run: bun run knip
    - name: Knip Production
      run: bun run knip:production
