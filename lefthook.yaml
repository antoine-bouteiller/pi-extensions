pre-commit:
  parallel: true
  jobs:
    - name: Check Lockfile
      glob: '*.{ts,js,mjs,cjs,yml,yaml,md,mdx,json}'
      run: pnpm install --lockfile-only --frozen-lockfile --ignore-scripts --silent
    - name: Check
      glob: '*.{ts,js,mjs,cjs}'
      run: pnpm exec oxlint --fix --fix-suggestions {staged_files}
      stage_fixed: true
    - name: Format
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    - name: Knip
      run: pnpm run knip
